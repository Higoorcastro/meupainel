activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
media3 = "1.11.1"
room = "2.8.5"
datastore = "1.2.1"
work = "2.12.0"
coroutines = "1.11.0"
coil = "3.6.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
