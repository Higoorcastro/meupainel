# =============================================================================
#  nginx — Digital Signage (painel web + API das TVs + mídias)
#
#  1. Domínio já configurado: meupainel.gestorshop.com
#  2. Copie para /etc/nginx/sites-available/meupainel e ative:
#       sudo ln -s /etc/nginx/sites-available/meupainel /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#  3. Gere o certificado HTTPS (o certbot adiciona o bloco 443 e o redirecionamento sozinho):
#       sudo certbot --nginx -d meupainel.gestorshop.com
#
#  O servidor Node roda no Docker em 127.0.0.1:3000 (bash deploy.sh em modo "proxy").
#
#  CLOUDFLARE: deixe o registro "meupainel" como "Somente DNS" (nuvem cinza). Com o proxy (nuvem laranja)
#  a Cloudflare (plano grátis) recusa uploads acima de 100 MB e esconde o IP real de quem acessa o painel.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name meupainel.gestorshop.com;

    # Uploads de vídeos grandes pelo painel: mantenha igual ou maior que MAX_UPLOAD_MB do .env.
    client_max_body_size 2048m;
    # Envia o upload direto ao Node em streaming (sem gravar o arquivo inteiro em disco temporário do nginx).
    proxy_request_buffering off;
    # Tolerância para conexões lentas (ex.: internet da loja enviando um vídeo grande).
    client_body_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Mídias baixadas pelas TVs: streaming direto (sem cópia temporária em disco), com suporte a Range.
    # O servidor já envia cache de 1 ano (arquivos têm nomes únicos e nunca mudam).
    location /media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # Painel web e API.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
